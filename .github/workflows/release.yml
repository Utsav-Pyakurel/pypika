name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - name: Setup PSE
        uses: predictive-speculative-execution/setup-pse@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_BUILD }}
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Cleanup PSE
        if: always()
        uses: predictive-speculative-execution/cleanup-pse@v1

  gather_status_build:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - name: Gather Status
        uses: predictive-speculative-execution/gather-status@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_BUILD }}

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Setup PSE
        uses: predictive-speculative-execution/setup-pse@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_PUBLISH }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Cleanup PSE
        if: always()
        uses: predictive-speculative-execution/cleanup-pse@v1

  gather_status_publish:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - name: Gather Status
        uses: predictive-speculative-execution/gather-status@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_PUBLISH }}
