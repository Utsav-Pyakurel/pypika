name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup PSE
        uses: predictive-speculative-execution/setup-pse@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_LINT }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
      - uses: pre-commit/action@v3.0.0
      - name: Cleanup PSE
        if: always()
        uses: predictive-speculative-execution/cleanup-pse@v1

  gather_status_lint:
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - name: Gather Status
        uses: predictive-speculative-execution/gather-status@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_LINT }}

  test:
    name: Unit tests on Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.9", "pypy3.10", "pypy3.11"]

    steps:
      - name: Setup PSE
        uses: predictive-speculative-execution/setup-pse@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_TEST }}
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: python -m pip install -U pip -r requirements-dev.txt

      - name: Run test suite
        run: python -m unittest discover

      - name: Install coverage dependencies
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: pip install coveralls

      - name: Run coverage
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          coverage run -m unittest discover
          coverage xml
          coveralls --service=github
      - name: Cleanup PSE
        if: always()
        uses: predictive-speculative-execution/cleanup-pse@v1

  gather_status_test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - name: Gather Status
        uses: predictive-speculative-execution/gather-status@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_TEST }}

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup PSE
        uses: predictive-speculative-execution/setup-pse@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_MYPY }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install mypy
          mypy .
      - name: Cleanup PSE
        if: always()
        uses: predictive-speculative-execution/cleanup-pse@v1

  gather_status_mypy:
    needs: mypy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      packages: read
    steps:
      - name: Gather Status
        uses: predictive-speculative-execution/gather-status@v1
        with:
          api_key: ${{ secrets.PSE_API_KEY_MYPY }}
